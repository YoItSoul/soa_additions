name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ForgeGradle 6 cannot run on newer JDKs; 17 also matches the Java
      # toolchain the 1.20.1 mod compiles against.
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # SoA_Radiance/ (the bundled shaderpack) is Complementary-licensed and
      # deliberately not in the repo, so CI jars omit SoA_Radiance.zip.
      # Release jars must be built locally where the shaderpack exists.
      - name: Build with Gradle
        run: ./gradlew build
