plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Toolchain bumped to Java 21 so we can compile against Jade 11.13+, which
// is Java-21-compiled. Source and target bytecode level stay at 17 — Forge
// 1.20.1 still expects 17-bytecode mods, but the JDK doing the compiling
// just needs to be ≥ the highest classfile level on the classpath.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.sourceCompatibility = JavaVersion.VERSION_17
java.targetCompatibility = JavaVersion.VERSION_17

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        // JEI lives here
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // Curios API
        name = "Illusive Soulworks"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        // Most third-party compile deps. Every coordinate below was verified
        // byte-identical (sha1) to the jar the pack actually ships.
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    ivy {
        // Smithery — our own mod, resolved straight from its GitHub release
        // assets (https://github.com/YoItSoul/smithery/releases). New versions
        // need a release tagged v<version> with the forge jar attached.
        name = "Smithery GitHub releases"
        url = "https://github.com/YoItSoul/smithery/releases/download"
        patternLayout {
            artifact "v[revision]/[artifact]-forge-1.20.1-[revision].[ext]"
        }
        metadataSources { artifact() }
        content {
            includeModule "com.soul", "smithery"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // JEI is compile-only so the mod still loads when JEI is absent. The
    // JEI plugin class is annotated with @JeiPlugin and only instantiated
    // by JEI itself, so reflective failures don't reach our other code.
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:15.3.0.8")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:15.3.0.8")

    // Curios — compile-only. GreedyBagItem implements ICurio and would crash
    // dev startup if the class linked against a missing ICurio, so it lives in
    // the curios/ subpackage along with GreedyBagEvents, both gated behind a
    // ModList.isLoaded("curios") check in SoaAdditions's constructor.
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1")
    // Pinned to the exact 11.13.2 rebuild the pack shipped (sha1-verified on
    // Modrinth). The cursemaven 5444008 was an older 11.13.2 build that still
    // exposed IComponentProvider; the rebuild Snownee shipped later under the
    // same display version removed it, so compiling against the older API
    // caused NoClassDefFoundError at plugin discovery time.
    compileOnly fg.deobf("maven.modrinth:jade:11.13.2+forge")

    // Just Enough Resources — compile-only for the JerIntegration plugin
    // (com.soul.soa_additions.compat.jer). Implements IJERPlugin so JER's
    // ModFileScanData scanner picks it up at startup; class never loads when
    // JER is absent.
    compileOnly fg.deobf("curse.maven:jer-240630:5057220") // 1.20.1-1.4.0.247

    // Resourceful Lootbags + ResourcefulLib — compile-only for the JEI
    // "Loot Crate Contents" category (reads lootbags:loot recipes' typed
    // Loot/LootEntry records). Classes only load when lootbags is present.
    // Lootbags pinned by Modrinth version ID (yJ5BKMXq = 2.0.2 forge) because
    // the fabric build shares the "2.0.2" version number.
    compileOnly fg.deobf("maven.modrinth:resourceful-lootbags:yJ5BKMXq")
    compileOnly fg.deobf("maven.modrinth:resourceful-lib:2.1.29")

    // ItemStages + GameStages — compile-only for GreedyBag stage checks.
    // Published by Darkhax on Jared's maven (already declared above).
    compileOnly fg.deobf("net.darkhax.itemstages:ItemStages-Forge-1.20.1:8.0.3")
    compileOnly fg.deobf("net.darkhax.gamestages:GameStages-Forge-1.20.1:15.0.2")

    // Botania — compile-only for TaskCollector mana integration and
    // smithery modifier effects (terrasteel, elementium traits).
    compileOnly fg.deobf("curse.maven:botania-225643:5594997")

    // ProjectE — compile-only for EMC quest tasks and smithery material
    // traits (dark matter, red matter).
    compileOnly fg.deobf("curse.maven:projecte-226410:4901949")

    // Avaritia Universal — compile-only for infinity-tier material defs
    // and ModItems registration.
    compileOnly fg.deobf("curse.maven:avaritia-universal-891434:7141546")

    // Blood Magic — compile-only for Blood Arsenal content.
    // Blood Arsenal items/blocks/rituals only register when BM is present at runtime.
    // Pulled via CurseMaven since BM doesn't publish a public maven for 1.20.1.
    compileOnly fg.deobf("curse.maven:blood-magic-224791:7253333")

    // Draconic Evolution + its hard deps (BrandonsCore, CodeChickenLib).
    // curse.maven rejects these (author disabled 3rd-party sharing), but the
    // author publishes them on Modrinth himself.
    compileOnly fg.deobf("maven.modrinth:draconic-evolution:3.1.2.621")
    compileOnly fg.deobf("maven.modrinth:brandons-core:3.2.1.302")
    compileOnly fg.deobf("maven.modrinth:codechicken-lib:4.4.0.516")

    // Malum — soul-harvest trait calls SpiritHarvestHandler; Lodestone is Malum's lib.
    // Valoria — smithery material integration for its metals. Versions = the pack's.
    // Lodestone pinned by Modrinth version ID (dRIycWqx = 1.20.1-1.6.4.1 forge)
    // because the fabric build shares the version number.
    compileOnly fg.deobf("maven.modrinth:malum:1.20.1-1.6.7")
    compileOnly fg.deobf("maven.modrinth:lodestonelib:dRIycWqx")
    compileOnly fg.deobf("curse.maven:valoria-698244:8139302") // 1.20.1-1.0.3.2

    // InsaneLib — provides PlayerExhaustionEvent for the GC HungerTweaker
    // Tip 52 port (low-food drain-skip RNG). Wired through
    // InsaneLibHungerBridge with a runtime ModList.isLoaded("insanelib")
    // gate in SoaAdditions main, so the mod stays optional.
    compileOnly fg.deobf("maven.modrinth:insanelib:1.23.4.4")

    // Reskillable — provides SkillCapability/SkillModel for the 9 GC custom
    // traits port (compatskills/traits.zs). All trait handlers gated on
    // ModList.isLoaded("reskillable") in SoaAdditions main.
    compileOnly fg.deobf("curse.maven:reskillable-1170464:7958820") // 4.6.3.0-1.20.1

    // Smithery — resolved from the GitHub release assets (ivy repo above)
    compileOnly fg.deobf("com.soul:smithery:1.5.3")

    // MysticalAgriculture crop plugin API (SoaMysticalCropsPlugin) + its Cucumber library
    compileOnly fg.deobf("maven.modrinth:mystical-agriculture:7.0.24")
    compileOnly fg.deobf("maven.modrinth:cucumber:7.0.16")

    // Patchouli — BookOpenItem opens the ported GC lore books (always in pack)
    compileOnly fg.deobf("maven.modrinth:patchouli:1.20.1-85-forge")

    // Thin Air — target of the AirQualityCacheMixin perf patch
    compileOnly fg.deobf("maven.modrinth:thin-air:v8.1.7-1.20.1-Forge")

    // Cyclic + Aquaculture — the two halves of the Fishing Net integration
    // (com.soul.soa_additions.cyclicaqua). Cyclic supplies the TileFisher mixin
    // target and its chance config; Aquaculture supplies hooks, bait and the
    // loot tables. Both are compile-only and every class that names them lives
    // behind the CyclicAquaFisher.isActive() gate, so neither is required at
    // runtime. Both coordinates sha1-verified byte-identical to the pack's jars:
    // Cyclic     f5e2a09fea3345f0bd891b613452d6ccb64b9865
    // Aquaculture 308a0e92401e29bdb9cae24532a3b07a1bf6e757
    compileOnly fg.deobf("maven.modrinth:cyclic:1.20.1-1.13.7")
    compileOnly fg.deobf("maven.modrinth:aquaculture:2.5.7")
}

// Bundle the SoA Radiance shaderpack (repo-root SoA_Radiance/, the canonical
// source) into the jar as a single zip; ShaderpackInstaller extracts it into
// the instance's shaderpacks dir at startup. A zip beats 375 loose resource
// entries and keeps the installer's file list from drifting out of date.
tasks.register('zipShaderpack', Zip) {
    from('SoA_Radiance') {
        exclude '.gitignore', '.soa_version', 'HOW TO INSTALL.txt'
    }
    archiveFileName = 'SoA_Radiance.zip'
    destinationDirectory = file(layout.buildDirectory.dir('generated/shaderpack/assets/soa_additions/shaderpacks'))
}

sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/shaderpack'))

tasks.named('processResources', ProcessResources).configure {
    dependsOn 'zipShaderpack'
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// The Lite Mode bootstrap MUST ship as its own jar.
//
// Forge's ModDirTransformerDiscoverer scans mods/*.jar for
// META-INF/services/cpw.mods.modlauncher.api.ITransformationService, hands any
// jar that declares one to ModLauncher's boot layer, and then EXCLUDES that jar
// from the normal mod scan. Shipping the service descriptor inside the mod jar
// therefore stopped soa_additions from being loaded as a mod at all — the game
// booted with the jar present but the modid absent, which surfaced downstream as
// "Unknown item soa_additions:..." datapack failures and a world-load crash.
//
// LiteModeBootstrap is self-contained (JDK + ModLauncher API only, by design),
// so it needs no reobfuscation and can live in a plain jar alongside the mod.
// Classes that touch the mods folder. These live in the boot-layer jar, NOT in
// the mod jar — both because a jar declaring an ITransformationService is
// excluded from the mod scan, and so the CurseForge-uploaded soa_additions jar
// contains no mods-folder file manipulation for the scanner to flag.
// The game-layer UI (DeckModeClientEvents, LiteCountdownScreen) stays in the mod
// jar and calls into these; the game layer resolves plugin-layer classes through
// its parent layer, the same way mods reference Mixin.
// They live in their own package (…liteboot, not …deckmode) on purpose: the
// package would otherwise exist in both the boot layer and the game layer, and
// a split package across module layers risks LayerInstantiationException at
// startup. The UI half stays in …deckmode.
def liteModeBootClasses = ['com/soul/soa_additions/liteboot/**']

tasks.register('liteModeJar', Jar) {
    // Constant filename, deliberately unversioned: each deploy overwrites the
    // previous copy. Two differently-versioned copies in mods/ would both
    // register the 'soa_additions_litemode' transformer service and ModLauncher
    // rejects duplicate service names — bricking the launch. Version is
    // recorded in the manifest instead.
    archiveFileName = 'soa_litemode.jar'
    manifest {
        attributes(['Implementation-Version': project.mod_version])
    }
    from(sourceSets.main.output) {
        liteModeBootClasses.each { include it }
    }
    from(sourceSets.main.resources) {
        include 'META-INF/services/cpw.mods.modlauncher.api.ITransformationService'
    }
}
tasks.named('assemble').configure { dependsOn 'liteModeJar' }

tasks.named('jar', Jar).configure {
    // see liteModeJar above — the descriptor and every mods-folder-touching
    // class ship in soa_litemode.jar instead, keeping this jar clean for
    // CurseForge's upload scanner.
    exclude 'META-INF/services/cpw.mods.modlauncher.api.ITransformationService'
    liteModeBootClasses.each { exclude it }
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                // Mixins target only OTHER MODS' (deobf) classes, so no refmap
                // or MixinGradle is needed — the manifest entry alone loads it.
                'MixinConfigs'            : 'soa_additions.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    // Silence javac's [removal] category. Every hit is a Forge forward-compat
    // hint for 1.21, not something that actually disappears on 1.20.1:
    //
    //   new ResourceLocation(..)   -> ResourceLocation.fromNamespaceAndPath/parse
    //   ModLoadingContext.get()    -> "use the context from your mod constructor"
    //
    // Neither replacement is usable here. The ResourceLocation statics were
    // only added in Forge 47.4, and we ship forge_version_range=[47,) — calling
    // them would hand anyone on 47.0-47.3 a NoSuchMethodError on nearly every
    // registry lookup. ModLoadingContext.registerConfig is likewise reachable
    // only through the deprecated get() on this Forge line.
    //
    // Revisit if the pack ever pins Forge >= 47.4 or moves to 1.21.
    options.compilerArgs << '-Xlint:-removal'
}
